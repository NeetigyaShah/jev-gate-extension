<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  margin: 0; padding: 14px; font-size: 13px; color: #e6f1ff;
  background: radial-gradient(120% 60% at 50% -10%, #0e2a4a 0%, #060b14 55%, #04070d 100%);
  min-height: 100vh;
}
h3 { margin: 0; font-size: 15px; letter-spacing: 0.4px; display: flex; align-items: center; gap: 8px; }
h3 .dot { width: 9px; height: 9px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 10px #22d3ee; }
#status { font-size: 12px; color: #9fb3c8; background: rgba(34, 211, 238, 0.08); border: 1px solid rgba(34, 211, 238, 0.25); border-radius: 8px; padding: 7px 9px; margin: 10px 0; }
#status.ok { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.4); color: #86efac; }
#status.err { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.4); color: #fca5a5; }
label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #7d93ab; margin: 10px 0 4px; }
input, select { width: 100%; padding: 8px 9px; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 8px; font-size: 13px; background: rgba(15, 23, 42, 0.8); color: #e6f1ff; outline: none; }
input:focus, select:focus { border-color: #22d3ee; box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2); }
.actions { display: flex; gap: 6px; margin: 10px 0; }
button { flex: 1; padding: 8px 4px; font-size: 12.5px; font-weight: 600; border: 1px solid rgba(148, 163, 184, 0.35); background: rgba(30, 41, 59, 0.7); color: #e6f1ff; border-radius: 8px; cursor: pointer; transition: transform 150ms, box-shadow 150ms, background 150ms; }
button:hover { background: rgba(51, 65, 85, 0.9); }
button:active { transform: scale(0.97); }
button.primary { background: linear-gradient(135deg, #0ea5e9, #22d3ee); border: 0; color: #04121f; box-shadow: 0 2px 14px rgba(34, 211, 238, 0.35); }
button.primary:hover { box-shadow: 0 2px 20px rgba(34, 211, 238, 0.55); }
h4 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #7d93ab; }
#elements, #log { border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 8px; padding: 8px; overflow: auto; background: rgba(2, 6, 12, 0.6); }
#elements { height: 130px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; white-space: pre-wrap; color: #a5f3fc; }
#log { height: 200px; }
.step { border-bottom: 1px solid rgba(148, 163, 184, 0.12); padding: 3px 0; font-size: 12px; color: #cbd5e1; }
.step.first { color: #fff; font-weight: 600; }
.pending { background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.4); border-radius: 8px; padding: 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; color: #fde68a; }
.pending button { flex: none; padding: 5px 12px; }
.voice { border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 10px; padding: 9px 10px; background: rgba(2, 6, 12, 0.5); }
.vrow { display: flex; align-items: center; gap: 8px; }
.vdot { width: 9px; height: 9px; border-radius: 50%; background: #475569; flex: none; }
.vdot.live { background: #22d3ee; box-shadow: 0 0 10px #22d3ee; animation: vpulse 2.4s ease-in-out infinite; }
.vdot.armed { background: #4ade80; box-shadow: 0 0 12px #4ade80; animation: vpulse 1s ease-in-out infinite; }
@keyframes vpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.vtext { flex: 1; font-size: 12px; color: #9fb3c8; }
#voice, #ptt { flex: none; padding: 5px 10px; font-size: 12px; }
.switches { display: flex; gap: 12px; margin-top: 8px; }
.switches label { display: flex; align-items: center; gap: 5px; margin: 0; text-transform: none; letter-spacing: 0; font-size: 11.5px; color: #9fb3c8; }
.switches input[type=checkbox] { width: auto; }
</style>
</head>
<body>
<h3><span class="dot"></span>Jev Gate</h3>
<div id="status">Ready.</div>
<div class="voice">
<div class="vrow">
<span id="vdot" class="vdot"></span>
<span id="vtext" class="vtext">Voice off</span>
<button id="ptt">Talk</button>
<button id="voice">Listen</button>
</div>
<div class="switches">
<label><input id="voiceAuto" type="checkbox" checked /> Auto-run</label>
<label><input id="voiceSpeak" type="checkbox" checked /> Speak</label>
<label><input id="alwaysOn" type="checkbox" /> Always on</label>
</div>
<div class="actions">
<button id="miccheck">Mic check</button>
<button id="micfix">Mic settings</button>
<button id="openTab">Open as tab</button>
</div>
</div>
<label>Wake words · comma separated</label>
<input id="wake" placeholder="hey jev, hey jeff, jev" autocomplete="off" />
<label>Speech language · Chrome recognition</label>
<select id="sttlang">
<option value="en-IN" selected>en-IN · English (India)</option>
<option value="en-US">en-US · English (US)</option>
<option value="en-GB">en-GB · English (UK)</option>
<option value="hi-IN">hi-IN · Hindi (India)</option>
</select>
<label>Silence before running · milliseconds</label>
<input id="silence" type="number" min="400" max="10000" step="100" value="2000" />
<label>Groq key · Whisper transcription of the goal</label>
<input id="groqkey" type="password" placeholder="gsk_… (optional, improves accuracy)" autocomplete="off" />
<label>Whisper model</label>
<input id="sttmodel" placeholder="whisper-large-v3-turbo" autocomplete="off" />
<label>TypeSafe key · direct Jev API</label>
<input id="key" type="password" placeholder="TYPESAFE_API_KEY" autocomplete="off" />
<label>OpenRouter key · Jev decisions</label>
<input id="orkey" type="password" placeholder="sk-or-v1-…" autocomplete="off" />
<label>Jev model on OpenRouter</label>
<select id="ormodel">
<option value="~typesafe/jev-latest" selected>~typesafe/jev-latest</option>
</select>
<div class="actions"><button id="orcheck">Check Jev</button></div>
<label>Text model · writes form values (Jev cannot)</label>
<input id="textmodel" placeholder="deepseek/deepseek-v4-flash-0731" autocomplete="off" />
<label>Goal</label>
<input id="goal" placeholder="e.g. open second latest email" />
<div class="actions">
<button id="snap">Snapshot</button>
<button id="step" class="primary">Step once</button>
<button id="auto">Auto</button>
<button id="stop">Stop</button>
</div>
<label>DONE threshold · stop when done_check ≥ this</label>
<input id="doneThreshold" type="number" min="0.5" max="0.99" step="0.05" value="0.8" />
<div id="pending"></div>
<h4>Elements (<span id="count">0</span>)</h4>
<div id="elements">No snapshot yet.</div>
<h4>Log</h4>
<div id="log"></div>
<script type="module" src="panel/panel.js"></script>
</body>
</html>
